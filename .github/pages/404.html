<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · smoothstep</title>
  <script>
    // Old addresses: the app used to live at /app/, and /anim/<id> links belong to the classic site.
    (function () {
      var path = location.pathname;
      if (/^\/anim\//.test(path)) {
        location.replace("https://classic.smoothstep.io" + path + location.search + location.hash);
      } else if (/^\/app(\/|$)/.test(path)) {
        location.replace(path.replace(/^\/app\/?/, "/") + location.search + location.hash);
      }
    })();
  </script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a href="/">Open smoothstep</a></p>
  </main>
</body>
</html>
